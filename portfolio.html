<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio — Light Held Still</title>
<meta name="description" content="All collections by Light Held Still.">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="site-header"></header>

<section class="sec">
  <div class="sec-head">
    <div><div class="mono dim">All collections</div><h1 class="page-title">Portfolio</h1></div>
    <p>Organized by subject and mood, not geography.</p>
  </div>
  <div class="cards" id="cards"></div>
</section>
<footer id="site-footer"></footer>
<script src="js/catalog.js"></script>
<script>
siteChrome('portfolio');
document.getElementById('cards').innerHTML = COLLECTION_ORDER.map(k=>{
  const c=COLLECTIONS[k], n=byCollection(k).length;
  return `<a class="card" href="collection.html?c=${k}">
    <div class="frame"><div class="card-img"><img src="${imgPath(c.cover,'mid')}" alt="${esc(c.name)}" loading="lazy"></div></div>
    <div class="card-meta"><span class="card-name">${esc(c.name)}</span><span class="mono dim">${n} photographs</span></div>
    <p class="card-desc">${esc(c.desc)}</p></a>`;
}).join('') + `<a class="all" href="collection.html?c=all"><span class="mono dim">All images</span><span><span class="all-title">View the whole portfolio</span><span class="mono dim" style="display:block;margin-top:14px">${CATALOG.length} photographs</span></span></a>`;

</script>
</body>
</html>
