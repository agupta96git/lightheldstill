<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio — Light Held Still</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <a href="index.html" class="wordmark">Light Held Still</a>
  <nav class="nav-right">
    <div class="nav-dropdown">
      <button class="nav-dropdown-trigger">Portfolio <span class="caret">▾</span></button>
      <div class="nav-dropdown-menu">
        <div class="drop-col">
          <a class="drop-item" href="collection.html?c=stone-sky">Stone &amp; Sky</a>
          <a class="drop-item" href="collection.html?c=beyond-visible">Beyond Visible</a>
          <a class="drop-item" href="collection.html?c=flora">Flora</a>
        </div>
        <div class="drop-divider-v"></div>
        <div class="drop-col">
          <a class="drop-item" href="collection.html?c=black-white">Black &amp; White</a>
          <a class="drop-item" href="collection.html?c=light">Light</a>
        </div>
        <div class="drop-divider-v"></div>
        <div class="drop-col-right">
          <a class="drop-view-all" href="portfolio.html">View All Images →</a>
        </div>
      </div>
    </div>
    <a class="nav-link" href="index.html#about">About</a>
    <a class="nav-link" href="index.html#contact">Contact</a>
    <button class="nav-toggle" aria-label="Menu">&#9776;</button>
  </nav>
</header>

<section class="section" style="padding-top:6rem">
  <div class="section-head">
    <div>
      <div class="section-eyebrow">All Collections</div>
      <h2 class="section-title">Portfolio</h2>
    </div>
  </div>
  <div class="collection-grid" id="collection-grid"></div>
</section>

<footer class="site-footer">
  <span>&copy; 2026 Light Held Still. All images reserved.</span>
  <div class="footer-links">
    <a href="portfolio.html">Portfolio</a>
    <a href="index.html#about">About</a>
    <a href="index.html#contact">Contact</a>
  </div>
</footer>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close">Close &times;</button>
  <button class="lightbox-prev" aria-label="Previous">&#8249;</button>
  <button class="lightbox-next" aria-label="Next">&#8250;</button>
  <img src="" alt="">
  <div class="lightbox-cap">
    <p class="lightbox-title"></p>
    <p class="lightbox-sub"></p>
    <button class="lightbox-order-btn" onclick="openOrderPanel(lbItems[lbIndex])">Order this Print</button>
  </div>
</div>

<script src="js/catalog.js"></script>
<script>
  const grid = document.getElementById('collection-grid');
  const order = ['stone-sky','beyond-visible','flora','black-white','light'];
  grid.innerHTML = order.map(key => {
    const c = COLLECTIONS[key];
    const count = byCollection(key).length;
    return `
      <a class="collection-card" href="collection.html?c=${key}">
        <img src="${imgPath(c.cover, 'thumb')}" alt="${c.name}">
        <div class="collection-meta">
          <div class="collection-count">${count} Photographs</div>
          <h3 class="collection-name">${c.name}</h3>
          <p class="collection-desc">${c.desc}</p>
        </div>
      </a>
    `;
  }).join('');
</script>
</body>
</html>
